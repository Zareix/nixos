#cloud-config
# Invité Debian (trixie) pour mercure — image cloud, sans GUI.
# Volontairement minimal : tout le reste (paquets utiles, Hermes, unité systemd,
# montage de /opt/data) s'installe à la main, voir hosts/jupiter/mercure/README.md §2.

timezone: Europe/Paris
package_update: true
package_upgrade: false

# Pas de bloc `users:` : l'image cloud fournit `debian` en uid/gid 1000, ce qui
# correspond exactement au propriétaire de /opt/data côté hôte (aucun chown).
# Pas de SSH non plus : l'administration passe par `incus exec`.

packages:
  - qemu-guest-agent
  - ca-certificates
  - curl
  - git
  - jq

runcmd:
  - systemctl enable --now qemu-guest-agent
