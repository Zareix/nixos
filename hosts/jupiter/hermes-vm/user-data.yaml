#cloud-config
# Invité Debian (trixie) pour Hermes Agent — image cloud, sans aucune GUI.
# Volontairement minimal : le reste est fait par /root/provision.sh, poussé et
# exécuté depuis l'hôte (systemd.services.hermes-vm-provision).

timezone: Europe/Paris
package_update: true
package_upgrade: false

# Pas de bloc `users:` : l'image cloud Debian fournit `debian` en uid/gid 1000.
# provision.sh le renomme en `hermes` pour conserver exactement l'uid 1000 qui
# possède /opt/data sur l'hôte (migration sans chown).
# Pas de SSH non plus : l'administration passe par `incus exec`.

packages:
  - qemu-guest-agent
  - ca-certificates
  - curl
  - git
  - jq

runcmd:
  - systemctl enable --now qemu-guest-agent
